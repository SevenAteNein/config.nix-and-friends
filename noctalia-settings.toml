config_version = 7

[audio]
enable_sounds = true

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "power" ]

[dock]
active_monitor_only = true
concave_edge_corners = false
enabled = true
icon_size = 40
launcher_position = "start"
margin_edge = 4
pinned = [
    "kitty",
    "proton-mail",
    "org.qbittorrent.qBittorrent",
    "spotify",
    "signal",
    "discord",
    "steam",
    "org.musescore.MuseScore",
    "org.inkscape.Inkscape",
    "startcenter",
    "zotero",
    "code"
]
radius = 20
show_dots = true
smart_auto_hide = true

[location]
address = "Berlin, Deutschland"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 213.0
    box_width = 810.0
    cx = 640.0
    cy = 609.5
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true
        show_session_buttons = true

[shell]
external_ip_enabled = true
panel_anchor_bar = "default"
telemetry_enabled = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 35

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Macchiato Lavender"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/nix/store/13ahxxk119mv874y105p9prmkbdd08cd-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/13ahxxk119mv874y105p9prmkbdd08cd-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"